[project]
name = "xsweep"
version = "0.3.0"
description = "Minimal, content-agnostic parameter sweeps for xarray."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kévin Walcarius", email = "kevin.walcarius@gmail.com" }]
keywords = [
    "xarray",
    "parameter-sweep",
    "zarr",
    "scientific-computing",
    "earth-observation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "xarray",
    "zarr>=3",
]

# Dask is an executor backend only. No core path imports it.
[project.optional-dependencies]
dask = ["dask"]
# Only used to render Plan reports as tables; explain()/repr(plan) fall back
# to plain text when it is absent. No core path imports it.
rich = ["rich"]

[project.urls]
Repository = "https://github.com/walcark/xsweep"
Changelog = "https://github.com/walcark/xsweep/blob/main/CHANGELOG.md"
Documentation = "https://github.com/walcark/xsweep/blob/main/docs/guide.md"
Issues = "https://github.com/walcark/xsweep/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# --- pixi -------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
xsweep = { path = ".", editable = true }

# Dev/runtime env pinned to 3.12 (numpy's typed stubs need 3.12+ to type-check);
# the library itself still targets 3.11+ (see requires-python and ruff target).
[tool.pixi.dependencies]
python = "3.12.*"
numpy = "*"
xarray = "*"
zarr = ">=3"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = ">=1.5"
pytest = "*"
pytest-cov = ">=6.0"
rich = "*"
git-cliff = "*"
# Needed here too (not just under `docs`) so benchmark example scripts that
# plot can also run standalone via `pixi run -e dev python benchmarks/...`.
matplotlib = "*"

[tool.pixi.feature.dev.tasks]
fmt = "ruff format ."
fmt-check = "ruff format --check ."
lint = "ruff check src tests"
type-check = "mypy src"
test = "pytest -q --cov=xsweep --cov-report=term-missing --cov-report=xml"
all = { depends-on = ["fmt", "lint", "type-check", "test"] }
changelog = "git-cliff -o CHANGELOG.md"
bench = "python benchmarks/run.py"

# Builds docs/ (guide, reference, and the examples/ gallery) into the static
# site. Separate from `dev` since it pulls in sphinx and is not needed to work
# on the library.
[tool.pixi.feature.docs.dependencies]
sphinx = "*"
sphinx-gallery = "*"
shibuya = "*"
myst-parser = "*"
sphinx-design = "*"
sphinx-copybutton = "*"
matplotlib = "*"

[tool.pixi.feature.docs.tasks]
docs-build = "sphinx-build -b html docs docs/_build/html"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

# --- tooling ----------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
