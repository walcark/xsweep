name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev
      - name: fmt, lint, type-check, test
        run: pixi run -e dev all

      # Publishes coverage to Codecov for the README badge. Kept non-blocking
      # so CI stays green until the CODECOV_TOKEN secret is added.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          slug: walcark/xsweep
