name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
      - name: Build the example gallery
        # Sphinx-gallery re-executes every example to render its output; this
        # keeps that run from appending to the committed benchmark ledger
        # under an ephemeral runner hostname (see benchmarks/_lib/timing.py).
        env:
          XSWEEP_BENCH_SKIP_RECORD: "1"
        run: pixi run -e docs docs-build
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/site/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.0
